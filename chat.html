<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>الملف والمراسلة - عفاف حضرموت نت</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Tahoma,Arial,sans-serif;background:#f7faf8;color:#17372c}header{background:#fff;border-bottom:1px solid #e2eae6;padding:14px 5%;display:flex;justify-content:space-between}.logo{font-size:21px;font-weight:800;color:#155c43}.btn{border:0;border-radius:11px;padding:10px 14px;font-weight:700;cursor:pointer;font-family:inherit}.green{background:#176447;color:#fff}.light{background:#e8f1ed;color:#176447}.danger{background:#f9e5e5;color:#9a2929}.wrap{max-width:850px;margin:auto;padding:25px 16px}.card{background:#fff;border:1px solid #dfe9e4;border-radius:18px;padding:18px;margin-bottom:15px}.name{font-size:23px;font-weight:800;color:#176447}.meta{color:#65746d;line-height:1.9;font-size:14px}.bio{margin-top:8px;line-height:1.8}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.notice{padding:10px;background:#fff7df;color:#765d17;border-radius:10px;margin-bottom:10px}.err{background:#f9e5e5;color:#9a2929}.chat{height:50vh;min-height:330px;overflow:auto;background:#f3f7f5;border-radius:14px;padding:12px}.msg{max-width:78%;padding:10px 13px;border-radius:14px;margin:8px 0;line-height:1.7;white-space:pre-wrap;word-break:break-word}.mine{margin-right:auto;background:#176447;color:#fff}.theirs{margin-left:auto;background:#fff;border:1px solid #dfe9e4}.time{display:block;font-size:10px;opacity:.7}.composer{display:flex;gap:8px;margin-top:10px}.composer textarea{flex:1;min-height:55px;padding:10px;border:1px solid #cbd8d2;border-radius:10px;font-family:inherit}.empty{text-align:center;padding:35px;color:#65746d}
</style></head><body><header><div class="logo">عفاف حضرموت نت</div><button class="btn light" onclick="location.href='search.html'">البحث</button></header><main class="wrap"><div id="profileCard" class="card"></div><div class="card"><h2>المراسلة الخاصة</h2><div id="notice"></div><div id="chat" class="chat"></div><form id="composer" class="composer" onsubmit="sendMessage(event)"><textarea id="body" maxlength="2000" placeholder="اكتب رسالة محترمة بهدف الزواج..." required></textarea><button class="btn green">إرسال</button></form></div></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const supabaseClient=window.supabase.createClient("https://zftdssfqavdlsnulpheq.supabase.co","sb_publishable_Sdgd2lds7bi-I3rDJA1GrQ_rqNmOk5L");const targetId=new URLSearchParams(location.search).get("user");let me=null,target=null,channel=null;
function safe(v){return String(v??"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#039;")}function note(t,e=false){document.getElementById("notice").innerHTML=t?`<div class="notice ${e?"err":""}">${safe(t)}</div>`:""}
async function init(){me=(await supabaseClient.auth.getUser()).data.user;if(!me){location.href="index.html";return}if(!targetId||targetId===me.id){note("لا يمكن فتح هذا الملف.",true);return}
const {data:p,error}=await supabaseClient.rpc("get_public_profile",{p_user_id:targetId});if(error||!p?.length){note("تعذر فتح الملف.",true);return}target=p[0];const statusRow=await supabaseClient.from("profiles").select("account_status").eq("user_id",targetId).maybeSingle();if(statusRow.data?.account_status==="blocked"){note("هذا الحساب موقوف حاليًا.",true);return}await supabaseClient.from("profile_views").upsert({viewer_id:me.id,viewed_user_id:targetId},{onConflict:"viewer_id,viewed_user_id"});renderProfile();
const approved=await hasApprovedPrivate();if(!approved){note("المراسلة الخاصة لا تفتح إلا بعد موافقة المشرف على طلب التواصل الخاص. يمكنك العودة للبحث وإرسال الطلب.",false);document.getElementById("composer").style.display="none";document.getElementById("chat").innerHTML='<div class="empty">بانتظار موافقة المشرف على طلب التواصل الخاص.</div>';return}
if(await isBlocked()){note("يوجد حظر بين الحسابين. لا يمكن المراسلة.",true);document.getElementById("composer").style.display="none";return}await loadMessages();channel=supabaseClient.channel("messages-"+[me.id,targetId].sort().join("-")).on("postgres_changes",{event:"INSERT",schema:"public",table:"messages"},p=>{const m=p.new;if((m.sender_id===me.id&&m.receiver_id===targetId)||(m.sender_id===targetId&&m.receiver_id===me.id))loadMessages()}).subscribe()}
function renderProfile(){const p=target;document.getElementById("profileCard").innerHTML=`<div class="name">${safe(p.name||"عضو")}</div><div class="meta">${p.age?safe(p.age)+" سنة • ":""}${safe(p.gender||"")}<br>${safe(p.city||"غير محددة")}${p.education?" • "+safe(p.education):""}${p.job?" • "+safe(p.job):""}<br>${p.skin?"لون البشرة: "+safe(p.skin):""}${p.tribal?" • "+safe(p.tribal):""}${p.marital?" • "+safe(p.marital):""}${p.height?" • "+safe(p.height)+" سم":""}</div>${p.bio?`<div class="bio">${safe(p.bio)}</div>`:""}<div class="actions"><button class="btn danger" onclick="reportUser()">إبلاغ عن المستخدم</button><button class="btn danger" onclick="blockUser()">حظر المستخدم</button></div>`}
async function hasApprovedPrivate(){const {data}=await supabaseClient.from("contact_requests").select("id").eq("request_type","private").eq("status","approved").or(`and(sender_user_id.eq.${me.id},receiver_user_id.eq.${targetId}),and(sender_user_id.eq.${targetId},receiver_user_id.eq.${me.id})`).limit(1);return !!data?.length}
async function isBlocked(){const {data}=await supabaseClient.from("user_blocks").select("id").or(`and(blocker_id.eq.${me.id},blocked_id.eq.${targetId}),and(blocker_id.eq.${targetId},blocked_id.eq.${me.id})`).limit(1);return !!data?.length}
async function loadMessages(){const {data,error}=await supabaseClient.from("messages").select("id,sender_id,receiver_id,body,created_at").or(`and(sender_id.eq.${me.id},receiver_id.eq.${targetId}),and(sender_id.eq.${targetId},receiver_id.eq.${me.id})`).order("created_at",{ascending:true});if(error){note(error.message,true);return}chat.innerHTML=data?.length?data.map(m=>`<div class="msg ${m.sender_id===me.id?"mine":"theirs"}">${safe(m.body)}<span class="time">${new Date(m.created_at).toLocaleString("ar-SA")}</span><button class="btn danger" style="padding:4px 8px;font-size:11px;margin-top:5px" onclick="reportMessage('${m.id}','${m.sender_id}')">إبلاغ</button></div>`).join(""):'<div class="empty">لا توجد رسائل بعد.</div>';chat.scrollTop=chat.scrollHeight}
async function sendMessage(e){e.preventDefault();const text=body.value.trim();if(!text)return;if(await isBlocked()){note("لا يمكن الإرسال بسبب الحظر.",true);return}const {error}=await supabaseClient.from("messages").insert({sender_id:me.id,receiver_id:targetId,body:text});if(error)note(error.message,true);else{body.value="";loadMessages()}}
async function reportMessage(id,sender){const reason=prompt("سبب الإبلاغ عن الرسالة:");if(!reason)return;const {error}=await supabaseClient.from("reports").insert({reporter_id:me.id,reported_user_id:sender,message_id:id,reason,details:"",status:"pending"});alert(error?"تعذر إرسال البلاغ: "+error.message:"تم إرسال البلاغ للمشرف ✅")}
async function reportUser(){const reason=prompt("سبب الإبلاغ عن المستخدم:");if(!reason)return;const {error}=await supabaseClient.from("reports").insert({reporter_id:me.id,reported_user_id:targetId,reason,details:"",status:"pending"});alert(error?"تعذر إرسال البلاغ: "+error.message:"تم إرسال البلاغ للمشرف ✅")}
async function blockUser(){if(!confirm("هل تريد حظر هذا المستخدم؟"))return;const {error}=await supabaseClient.from("user_blocks").insert({blocker_id:me.id,blocked_id:targetId});if(error&&error.code!=="23505"){alert(error.message);return}note("تم الحظر. لا يمكن للمستخدمين المتحظرين المراسلة.");document.getElementById("composer").style.display="none"}
init();
</script></body></html>
