<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>لوحة المشرف - عفاف حضرموت نت</title><style>*{box-sizing:border-box}body{margin:0;font-family:Tahoma,Arial,sans-serif;background:#f7faf8;color:#17372c}.wrap{max-width:1200px;margin:auto;padding:22px 15px}.head,.card{background:#fff;border:1px solid #dfe9e4;border-radius:18px;padding:18px;margin-bottom:15px}.tabs,.toolbar{display:flex;gap:8px;flex-wrap:wrap}.btn{border:0;border-radius:10px;padding:9px 13px;font-weight:700;cursor:pointer;font-family:inherit}.green{background:#176447;color:#fff}.light{background:#e8f1ed;color:#176447}.danger{background:#f9e5e5;color:#9a2929}.yellow{background:#fff4d6;color:#765d17}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.muted{color:#65746d;font-size:13px;line-height:1.8}.row{display:flex;justify-content:space-between;gap:10px;align-items:center;border-bottom:1px solid #edf1ef;padding:12px 0;flex-wrap:wrap}.empty{text-align:center;color:#65746d;padding:30px}.badge{display:inline-block;padding:5px 9px;border-radius:999px;background:#e8f1ed;color:#176447;font-size:12px;font-weight:700}@media(max-width:850px){.grid{grid-template-columns:1fr 1fr}}@media(max-width:520px){.grid{grid-template-columns:1fr}}</style></head><body><main class="wrap"><div class="head"><h1>لوحة تحكم المشرف</h1><p id="who">جارٍ التحقق...</p><div class="tabs" id="tabs"></div></div><div id="content" class="card">جارٍ التحميل...</div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const s=window.supabase.createClient("https://zftdssfqavdlsnulpheq.supabase.co","sb_publishable_Sdgd2lds7bi-I3rDJA1GrQ_rqNmOk5L"),c=document.getElementById("content"),tabs=document.getElementById("tabs"),who=document.getElementById("who");let me=null,role=null;
function safe(v){return String(v??"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#039;")}function can(...r){return r.includes(role)}function roleName(r){return r==="owner"?"مشرف رئيسي":r==="moderator"?"مشرف ثانٍ":"مشرف ثالث محدود"}function tab(t,f,k="green"){const b=document.createElement("button");b.className="btn "+k;b.textContent=t;b.onclick=f;tabs.appendChild(b)}
async function init(){me=(await s.auth.getUser()).data.user;if(!me){location.href="index.html";return}const {data:p,error}=await s.from("profiles").select("الاسم,is_admin,admin_role").eq("user_id",me.id).maybeSingle();if(error||!p||(p.is_admin!==true&&!p.admin_role)){c.innerHTML="<h2>غير مصرح</h2><p>هذه الصفحة للمشرفين فقط.</p>";return}role=p.admin_role||"moderator";who.innerHTML=`المشرف: <b>${safe(p["الاسم"]||me.email||"حساب مشرف")}</b> • <span class="badge">${roleName(role)}</span>`;tabs.innerHTML="";tab("طلبات التواصل",loadRequests);tab("البلاغات",loadReports);tab("أعطال الموقع",loadIssues);if(can("owner","moderator"))tab("المستخدمون",loadUsers);if(can("owner","moderator"))tab("الرسائل",loadMessages);if(can("owner"))tab("المشرفون",loadAdmins);if(can("owner","moderator"))tab("سجل الإجراءات",loadAudit);tab("تواصل معنا",loadContacts);tab("الموقع",()=>location.href="index.html","light");loadRequests()}
async function loadRequests(){const {data,error}=await s.from("contact_requests").select("*").order("created_at",{ascending:false});if(error){c.innerHTML=safe(error.message);return}c.innerHTML="<h2>طلبات التواصل</h2>"+(data||[]).map(r=>`<div class="row"><div><b>${r.request_type==="private"?"خاص":"رسمي"} • ${safe(r.status)}</b><div class="muted">${safe(r.message||"")}<br>${safe(r.sender_user_id)} → ${safe(r.receiver_user_id)}</div></div><div>${r.status==="pending"?`<button class="btn green" onclick="setRequest('${r.id}','approved')">قبول</button> <button class="btn danger" onclick="setRequest('${r.id}','rejected')">رفض</button>`:""}</div></div>`).join("")||'<div class="empty">لا توجد طلبات.</div>'}
async function setRequest(id,status){const {error}=await s.from("contact_requests").update({status,reviewed_at:new Date().toISOString(),reviewed_by:me.id}).eq("id",id);if(error){alert(error.message);return}await log("مراجعة طلب تواصل","contact_request",id,{status});loadRequests()}
async function loadReports(){const {data,error}=await s.from("reports").select("*").order("created_at",{ascending:false});if(error){c.innerHTML=safe(error.message);return}c.innerHTML="<h2>البلاغات</h2>"+(data||[]).map(r=>`<div class="row"><div><b>${safe(r.reason||"بلاغ")}</b><div class="muted">${safe(r.details||"")}<br>المبلّغ: ${safe(r.reporter_id)}<br>المبلّغ عنه: ${safe(r.reported_user_id)}${r.message_id?"<br>الرسالة: "+safe(r.message_id):""}<br>الحالة: ${safe(r.status)}</div></div><div>${r.status!=="closed"?`<button class="btn green" onclick="closeReport('${r.id}')">تمت المراجعة</button>`:"<span class='badge'>مغلق</span>"}</div></div>`).join("")||'<div class="empty">لا توجد بلاغات.</div>'}
async function closeReport(id){const {error}=await s.from("reports").update({status:"closed",reviewed_at:new Date().toISOString(),reviewed_by:me.id}).eq("id",id);if(error){alert(error.message);return}await log("مراجعة بلاغ","report",id,{status:"closed"});loadReports()}
async function loadIssues(){const {data,error}=await s.from("site_issues").select("*").order("created_at",{ascending:false});if(error){c.innerHTML=safe(error.message);return}c.innerHTML="<h2>بلاغات أعطال الموقع</h2>"+(data||[]).map(x=>`<div class="row"><div><b>${safe((x.description||"").slice(0,100))}</b><div class="muted">${safe(x.name||"بدون اسم")} • ${safe(x.email||"")}<br>الصفحة: ${safe(x.page_url||"")}<br>الحالة: ${safe(x.status)}<br>${new Date(x.created_at).toLocaleString("ar-SA")}</div></div><div class="toolbar"><button class="btn yellow" onclick="setIssue('${x.id}','in_review')">قيد المراجعة</button><button class="btn green" onclick="setIssue('${x.id}','resolved')">تم الحل</button><button class="btn light" onclick='showIssue(${JSON.stringify(x.description||"")})'>التفاصيل</button></div></div>`).join("")||'<div class="empty">لا توجد بلاغات أعطال.</div>'}function showIssue(t){alert(t)}
async function setIssue(id,status){const {error}=await s.from("site_issues").update({status,assigned_to:me.id}).eq("id",id);if(error){alert(error.message);return}await log("تحديث بلاغ عطل","site_issue",id,{status});loadIssues()}
async function loadUsers(){const {data,error}=await s.from("profiles").select('user_id,الاسم,العمر,الجنس,المدينة,الوظيفة,is_admin,admin_role,account_status,created_at').order("created_at",{ascending:false});if(error){c.innerHTML=safe(error.message);return}c.innerHTML="<h2>المستخدمون</h2><div class='grid'>"+(data||[]).map(p=>`<div class="card"><b>${safe(p["الاسم"]||"بدون اسم")}</b><div class="muted">${safe(p["الجنس"]||"")} • ${safe(p["العمر"]||"")} • ${safe(p["المدينة"]||"")}<br>الحالة: <span class="badge">${safe(p.account_status||"active")}</span></div>${can("owner","moderator")?`<div class="toolbar"><button class="btn ${p.account_status==="blocked"?"green":"danger"}" onclick="setUserStatus('${p.user_id}','${p.account_status==="blocked"?"active":"blocked"}')">${p.account_status==="blocked"?"رفع الحظر":"حظر"}</button></div>`:""}</div>`).join("")+"</div>"}
async function setUserStatus(id,status){const {error}=await s.rpc("set_user_status",{p_user_id:id,p_status:status});if(error){alert(error.message);return}await log(status==="blocked"?"حظر مستخدم":"رفع حظر مستخدم","user",id,{status});loadUsers()}
async function loadMessages(){const {data,error}=await s.from("messages").select("id,sender_id,receiver_id,body,created_at").order("created_at",{ascending:false}).limit(100);if(error){c.innerHTML=safe(error.message);return}c.innerHTML="<h2>مراجعة الرسائل</h2>"+(data||[]).map(m=>`<div class="row"><div><b>${safe((m.body||"").slice(0,140))}</b><div class="muted">${safe(m.sender_id)} → ${safe(m.receiver_id)}<br>${new Date(m.created_at).toLocaleString("ar-SA")}</div></div><button class="btn danger" onclick="deleteMessage('${m.id}')">حذف</button></div>`).join("")||'<div class="empty">لا توجد رسائل.</div>'}
async function deleteMessage(id){if(!confirm("حذف الرسالة؟"))return;const {error}=await s.rpc("admin_delete_message",{p_message_id:id});if(error){alert(error.message);return}loadMessages()}
async function loadAdmins(){const {data,error}=await s.from("profiles").select('user_id,الاسم,admin_role,is_admin,created_at').not("admin_role","is",null).order("created_at",{ascending:false});if(error){c.innerHTML=safe(error.message);return}c.innerHTML="<h2>إدارة المشرفين</h2><p>كل مشرف يستخدم حسابًا مستقلًا. المشرف الرئيسي وحده يغيّر الصلاحيات.</p>"+(data||[]).map(p=>`<div class="row"><div><b>${safe(p["الاسم"]||p.user_id)}</b><div class="muted">${safe(p.user_id)} • ${roleName(p.admin_role)}</div></div><div class="toolbar"><button class="btn light" onclick="changeRole('${p.user_id}','moderator')">مشرف ثانٍ</button><button class="btn light" onclick="changeRole('${p.user_id}','limited')">مشرف ثالث</button><button class="btn danger" onclick="changeRole('${p.user_id}',null)">إزالة</button></div></div>`).join("")||'<div class="empty">لا يوجد مشرفون.</div>'}
async function changeRole(id,newRole){if(!confirm("تأكيد تغيير الصلاحية؟"))return;const {error}=await s.rpc("set_admin_role",{p_user_id:id,p_role:newRole});if(error){alert(error.message);return}loadAdmins()}
async function loadAudit(){const {data,error}=await s.from("admin_audit_log").select("*").order("created_at",{ascending:false}).limit(200);if(error){c.innerHTML=safe(error.message);return}c.innerHTML="<h2>سجل الإجراءات</h2>"+(data||[]).map(a=>`<div class="row"><div><b>${safe(a.action)}</b><div class="muted">المشرف: ${safe(a.admin_user_id)} • الهدف: ${safe(a.target_type||"")} ${safe(a.target_id||"")}<br>${new Date(a.created_at).toLocaleString("ar-SA")}<br>${safe(JSON.stringify(a.details||{}))}</div></div></div>`).join("")||'<div class="empty">لا يوجد سجل.</div>'}
async function log(action,target,id,details){const {error}=await s.rpc("log_admin_action",{p_action:action,p_target_type:target,p_target_id:id,p_details:details||{}});if(error)console.warn(error.message)}
async function loadContacts(){const {data,error}=await s.from("contact_messages").select("*").order("created_at",{ascending:false});if(error){c.innerHTML=safe(error.message);return}c.innerHTML="<h2>تواصل معنا</h2>"+(data||[]).map(x=>`<div class="row"><div><b>${safe(x.name||"بدون اسم")} • ${safe(x.email||"")}</b><div class="muted">${safe(x.message)}<br>${safe(x.status||"new")}</div></div><button class="btn green" onclick="closeContact('${x.id}')">إغلاق</button></div>`).join("")||'<div class="empty">لا توجد رسائل.</div>'}
async function closeContact(id){const {error}=await s.from("contact_messages").update({status:"closed"}).eq("id",id);if(error){alert(error.message);return}await log("إغلاق رسالة تواصل","contact_message",id,{});loadContacts()}
init();</script></body></html>
